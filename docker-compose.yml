version: '3.8'

services:

  # Tier 3: PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: task-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME:-taskdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-taskdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - task-network


  # Tier 2: Node.js / Express Backend
  backend:
    image: 058835008914.dkr.ecr.ap-south-1.amazonaws.com/backend_repo:latest
    container_name: task-backend
    restart: unless-stopped

    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-taskdb}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      CORS_ORIGIN: http://13.207.176.151:3000

    ports:
      - "5000:5000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - task-network


  # Tier 1: React / Nginx Frontend
  frontend:
    image: 058835008914.dkr.ecr.ap-south-1.amazonaws.com/frontend_repo:latest
    container_name: task-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - task-network


volumes:
  postgres_data:
    driver: local


networks:
  task-network:
    driver: bridge