apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend_deployment
  labels:
    app: task_app_deployment
spec:  #under specs comes template of pods you want replicaSet to run, skip apiVersion and kind from pod_creation.yml file
  template:
    metadata:
    name: Postgres_db
    labels:
      app: task_app_db
    spec:
      containers:
      - name: Postgres_db_container
        image: postgres:15-alpine
  replicas: 1
  selector: 
    matchlabels:
      app: task_app_db 